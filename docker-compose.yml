services:
  ticket-db:
    container_name: ticket-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketdb"]
      interval: 3s
      retries: 10

  booking-db:
    container_name: booking-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingdb"]
      interval: 3s
      retries: 10

  jaeger:
    container_name: jaeger
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI

  ticket-service:
    container_name: ticket-service
    build: ./ticket-service
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@ticket-db:5432/ticketdb
      OTEL_SERVICE_NAME: ticket-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      ticket-db:
        condition: service_healthy
      jaeger:
        condition: service_started

  booking-service:
    container_name: booking-service
    build: ./booking-service
    environment:
      PORT: 3002
      OTEL_SERVICE_NAME: booking-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DATABASE_URL: postgres://postgres:postgres@booking-db:5432/bookingdb
      TICKET_SERVICE_URL: http://ticket-service:3001
      DELAYED_USER_NAME: ${DELAYED_USER_NAME:-bob}
    depends_on:
      booking-db:
        condition: service_healthy
      ticket-service:
        condition: service_started
      jaeger:
        condition: service_started

  gateway:
    container_name: gateway
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:4173}
      AUTH_USERS: ${AUTH_USERS:-alice:alice123,bob:bob123}
      TICKET_SERVICE_URL: http://ticket-service:3001
      BOOKING_SERVICE_URL: http://booking-service:3002
    depends_on:
      - ticket-service
      - booking-service
      - jaeger

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "5173:80" # served on 5173 so it matches the gateway's default CORS_ORIGIN
    depends_on:
      - gateway
